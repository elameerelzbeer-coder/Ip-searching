                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit">دخول</button>
            </form>
            <p style="margin-top: 15px;">ليس لديك حساب؟ <a href="register.html" style="color: #2563eb; font-weight: bold;">إنشاء حساب جديد</a></p>
