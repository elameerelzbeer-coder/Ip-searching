<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - محدد موقع IP</title>
    <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
</head>
<body>
    <header>
        <div class="logo">📍 IP Finder</div>
        <button class="menu-toggle" id="mobile-menu">☰</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="search.html" id="search-link">البحث عن جهاز</a></li>
                <li><a href="about.html">نبذة عن الموقع</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="login.html" id="auth-link">تسجيل الدخول</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>إنشاء حساب جديد</h2>
            <form id="register-form">
                <div>
                    <label for="reg-username">اسم المستخدم:</label>
                    <input type="text" id="reg-username" name="username" required>
                </div>
                <div>
                    <label for="reg-email">البريد الإلكتروني:</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div>
                    <label for="reg-password">كلمة المرور:</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <button type="submit">تسجيل الحساب</button>
            </form>
            <p style="margin-top: 15px;">لديك حساب بالفعل؟ <a href="login.html" style="color: #2563eb; font-weight: bold;">تسجيل الدخول</a></p>
        </section>
    </main> 

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 | تصميم وتطوير الموقع</p>
    </footer>


</body>
</html>
